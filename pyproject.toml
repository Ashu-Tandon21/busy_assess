[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editorial-workflow"
version = "0.1.0"
description = "Django newsroom editorial workflow take-home."
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.4",
    "whitenoise==6.11.0",
    "gunicorn==23.0.0",
]
